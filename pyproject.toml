[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdaeco-axis"
version = "0.1.5"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["usdaeco-toolchain>=0.3.2,<0.4"]

[project.scripts]
aeco-axis = "usdaeco_axis.cli:main"

[tool.setuptools]
packages = ["usdaeco_axis", "usdAecoAxisValidators"]
package-dir = {usdaeco_axis = "tools/usdaeco_axis", usdAecoAxisValidators = "usdAecoAxisValidators"}

[tool.setuptools.package-data]
usdAecoAxisValidators = ["plugInfo.json"]

[tool.pytest.ini_options]
testpaths = ["testenv"]
python_files = ["test*.py"]
